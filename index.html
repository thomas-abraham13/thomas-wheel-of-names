<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7ef">
    <title>Thomas Wheel of Names</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Wheel controls">
        <form class="brand-block" id="wheelTitleForm">
          <p class="eyebrow">Shared wheel</p>
          <input id="wheelTitleInput" class="wheel-title-input" name="title" type="text" maxlength="60" value="Wheel of Names" aria-label="Wheel name">
        </form>
        <div class="wheel-actions">
          <div class="sync-pill" id="syncStatus">Starting</div>
          <div class="image-menu-wrap">
            <button class="top-image-button" id="imageMenuButton" type="button" aria-expanded="false" aria-controls="imageMenu">Image</button>
            <div class="image-menu" id="imageMenu" hidden>
              <p>Centre image</p>
              <label class="image-menu-action image-menu-upload" for="centerImageInput">Choose image</label>
              <input id="centerImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
              <button class="image-menu-action" id="resetCenterImageButton" type="button">Reset to default</button>
              <fieldset class="colour-options">
                <legend>Or use a colour</legend>
                <button type="button" data-center-color="#ffffff" style="--swatch: #ffffff" aria-label="Use white"></button>
                <button type="button" data-center-color="#1d211f" style="--swatch: #1d211f" aria-label="Use charcoal"></button>
                <button type="button" data-center-color="#0f766e" style="--swatch: #0f766e" aria-label="Use teal"></button>
                <button type="button" data-center-color="#f2c94c" style="--swatch: #f2c94c" aria-label="Use gold"></button>
                <button type="button" data-center-color="#7a4fb3" style="--swatch: #7a4fb3" aria-label="Use purple"></button>
              </fieldset>
              <small>PNG, JPG, WebP or GIF</small>
            </div>
          </div>
          <button class="icon-button" id="copyLinkButton" type="button" aria-label="Copy wheel link" title="Copy wheel link">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>
          <button class="icon-button" id="newWheelButton" type="button" aria-label="Create a new wheel" title="Create a new wheel">
            <span aria-hidden="true">+</span>
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="Wheel workspace">
        <div class="wheel-stage">
          <div class="wheel-wrap">
            <canvas id="wheelCanvas" width="900" height="900" role="button" tabindex="0" aria-label="Spin wheel"></canvas>
            <div class="pointer" aria-hidden="true"></div>
          </div>

          <div class="winner-overlay" id="winnerOverlay" hidden>
            <canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>
            <div class="winner-dialog" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
              <p class="eyebrow" id="winnerTitle">Selected name</p>
              <p class="winner-name" id="winnerName"></p>
              <div class="winner-actions">
                <button class="winner-remove" id="winnerRemoveButton" type="button">Remove name</button>
                <button class="winner-close" id="winnerCloseButton" type="button">Close</button>
              </div>
            </div>
          </div>

          <div class="spin-controls">
            <button class="spin-button" id="spinButton" type="button">Spin</button>
            <p class="result" id="resultText" aria-live="polite">Ready</p>
          </div>
        </div>

        <aside class="name-panel" aria-label="Names">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Wheel ID</p>
              <h2 id="wheelIdLabel">Loading</h2>
            </div>
            <span class="count-badge" id="nameCount">0</span>
          </div>

          <form class="name-form" id="nameForm">
            <label for="nameInput">Name</label>
            <div class="input-row">
              <input id="nameInput" name="name" type="text" maxlength="80" autocomplete="off" placeholder="Add a name">
              <button type="submit">Add</button>
            </div>
          </form>

          <div class="name-list" id="nameList" aria-live="polite"></div>
        </aside>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
